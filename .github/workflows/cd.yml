name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker-build-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/soc-investigator-backend:latest
            ghcr.io/${{ github.repository_owner }}/soc-investigator-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/soc-investigator-frontend:latest
            ghcr.io/${{ github.repository_owner }}/soc-investigator-frontend:${{ github.sha }}

  deploy:
    name: Deploy to EC2
    needs: docker-build-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy application to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd ~/soc-investigator-deploy

            echo "Pulling latest backend image..."
            docker pull ghcr.io/anshu-builds/soc-investigator-backend:latest

            echo "Pulling latest frontend image..."
            docker pull ghcr.io/anshu-builds/soc-investigator-frontend:latest

            echo "Recreating application containers..."
            docker compose up -d --no-deps backend frontend

            echo "Restarting Nginx..."
            docker compose up -d nginx

            echo "Deployment completed."

            echo "Running containers:"
            docker ps
