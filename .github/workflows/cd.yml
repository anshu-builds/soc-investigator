name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker-build-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          no-cache: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/soc-investigator-backend:latest
            ghcr.io/${{ github.repository_owner }}/soc-investigator-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/soc-investigator-frontend:latest
            ghcr.io/${{ github.repository_owner }}/soc-investigator-frontend:${{ github.sha }}

  deploy:
    name: Deploy to EC2
    needs: docker-build-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy application to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            cd ~/soc-investigator-deploy

            echo "=========================================="
            echo "Deploying commit: ${{ github.sha }}"
            echo "=========================================="

            echo "Pulling backend image for this commit..."
            docker pull ghcr.io/${{ github.repository_owner }}/soc-investigator-backend:${{ github.sha }}

            echo "Pulling frontend image for this commit..."
            docker pull ghcr.io/${{ github.repository_owner }}/soc-investigator-frontend:${{ github.sha }}

            echo "Tagging backend image as latest..."
            docker tag \
              ghcr.io/${{ github.repository_owner }}/soc-investigator-backend:${{ github.sha }} \
              ghcr.io/${{ github.repository_owner }}/soc-investigator-backend:latest

            echo "Tagging frontend image as latest..."
            docker tag \
              ghcr.io/${{ github.repository_owner }}/soc-investigator-frontend:${{ github.sha }} \
              ghcr.io/${{ github.repository_owner }}/soc-investigator-frontend:latest

            echo "Stopping old backend and frontend containers..."
            docker compose stop backend frontend || true

            echo "Removing old backend and frontend containers..."
            docker compose rm -f backend frontend || true

            echo "Starting backend and frontend with new images..."
            docker compose up -d --no-deps backend frontend

            echo "Restarting Nginx..."
            docker compose up -d nginx

            echo "Waiting for containers to start..."
            sleep 10

            echo "=========================================="
            echo "Deployment completed"
            echo "=========================================="

            echo "Running containers:"
            docker ps

            echo "=========================================="
            echo "Backend image:"
            echo "=========================================="
            docker inspect soc_backend --format '{{.Image}}'

            echo "=========================================="
            echo "Frontend image:"
            echo "=========================================="
            docker inspect soc_frontend --format '{{.Image}}'
